<!doctype html>
<html lang="{{ site.locale | replace: '_', '-' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include seo.html %}
    <link rel="icon" type="image/png" href="{{ '/images/favicon.png' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/computer-modern.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
  </head>
  <body>
    {% include research-background.html %}
    {% include site-header.html %}

    <main class="site-width {% if page.url == '/' %}home{% else %}interior{% endif %}" id="main" tabindex="-1">
      {% if page.url == '/' %}
        {{ content }}
      {% else %}
        <div class="page-heading"><h1>{{ page.title | escape }}</h1></div>
        <div class="page-content">{{ content }}</div>
      {% endif %}
    </main>

    {% include site-footer.html %}
  </body>
</html>
