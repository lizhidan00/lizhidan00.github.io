<footer class="site-footer">
  <div class="site-width site-footer__inner">
    <span>&copy; {{ site.time | date: '%Y' }} {{ site.title | escape }}</span>
    <ul class="text-links" role="list">
      <li><a href="{{ '/talks/' | relative_url }}"{% if page.url == '/talks/' %} aria-current="page"{% endif %}>Talks</a></li>
      <li><a href="{{ '/sitemap/' | relative_url }}"{% if page.url == '/sitemap/' %} aria-current="page"{% endif %}>Sitemap</a></li>
      <li><a href="{{ site.atom_feed.path | default: '/feed.xml' | relative_url }}">RSS</a></li>
    </ul>
  </div>
</footer>
